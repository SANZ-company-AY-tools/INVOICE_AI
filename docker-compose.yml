version: '3.8'

services:
  invoice-extractor:
    build: .
    container_name: invoice-extractor
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
